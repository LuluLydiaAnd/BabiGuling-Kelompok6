<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar — Babi Guling</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card">

        <a href="index.html" class="admin-back">
            <i class='bx bx-arrow-back'></i> Kembali ke Beranda
        </a>

        <!-- Tab: Login / Daftar -->
        <h1 class="admin-title" id="authTitle">Selamat Datang !</h1>
        <p class="admin-subtitle" id="authSubtitle">Masuk untuk melanjutkan</p>

        <div class="auth-tabs">
            <a href="#" class="auth-tab active" data-tab="login">Masuk</a>
            <a href="#" class="auth-tab" data-tab="register">Daftar</a>
        </div>

        <!-- Form login -->
        <form id="loginForm" class="admin-form">
            <div class="mb-3">
            <label class="form-label" for="loginUser">Username</label>
            <div class="input-icon">
                <i class='bx bx-user'></i>
                <input type="text" id="loginUser" class="form-control" placeholder="Masukkan username" required>
            </div>
            </div>
            <div class="mb-3">
            <label class="form-label" for="loginPass">Password</label>
            <div class="input-icon">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="loginPass" class="form-control" placeholder="Masukkan password" required>
            </div>
            </div>

            <div id="loginError" class="login-error d-none">
            <i class='bx bx-error-circle'></i> <span id="loginErrorText">Username atau password salah.</span>
            </div>

            <button type="submit" class="btn btn-admin-login w-100">
            Masuk <i class='bx bx-log-in'></i>
            </button>
        </form>

        <!-- Form Register -->
        <form id="registerForm" class="admin-form d-none">
            <div class="mb-3">
            <label class="form-label" for="regNama">Nama Lengkap</label>
            <div class="input-icon">
                <i class='bx bx-id-card'></i>
                <input type="text" id="regNama" class="form-control" placeholder="Nama lengkap" required>
            </div>
            </div>
            <div class="mb-3">
            <label class="form-label" for="regEmail">Email</label>
            <div class="input-icon">
                <i class='bx bx-envelope'></i>
                <input type="email" id="regEmail" class="form-control" placeholder="nama@email.com" required>
            </div>
            </div>
            <div class="mb-3">
            <label class="form-label" for="regUser">Username</label>
            <div class="input-icon">
                <i class='bx bx-user'></i>
                <input type="text" id="regUser" class="form-control" placeholder="Username unik" required>
            </div>
            </div>
            <div class="mb-3">
            <label class="form-label" for="regPass">Password</label>
            <div class="input-icon">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="regPass" class="form-control" placeholder="Min. 6 karakter" required>
            </div>
            </div>

            <div id="registerError" class="login-error d-none">
            <i class='bx bx-error-circle'></i> <span id="registerErrorText"></span>
            </div>

            <button type="submit" class="btn btn-admin-login w-100">
            Daftar <i class='bx bx-user-plus'></i>
            </button>
        </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
